name: CI

on:
  push:
    branches: [Dev-Daniel, Dev-Thulio]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Build (checagem de tipos)
        run: npm run build
      - name: Lint (sem --fix)
        run: npx eslint "{src,test}/**/*.ts"
      - name: Testes
        run: npx jest --testTimeout=60000
      - name: Audit (so falha em critico)
        run: npm audit --omit=dev --audit-level=critical

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:5002
      - name: Audit (so falha em critico)
        run: npm audit --omit=dev --audit-level=critical
