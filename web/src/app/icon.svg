<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="32" height="32" fill="none">
  <!-- Mesmo símbolo do logotipo (funil de três anéis, o de baixo em destaque). Favicon não lê as variáveis CSS do painel:
       as cores abaixo repetem --ink e --brand dos dois temas (docs/design-system.md) e trocam pelo tema do navegador. -->
  <style>
    .anel { stroke: #16222B; }
    .foco { stroke: #0B6B8A; fill: #0B6B8A; fill-opacity: 0.25; }
    @media (prefers-color-scheme: dark) {
      .anel { stroke: #E6EEF2; }
      .foco { stroke: #4FB3D3; fill: #4FB3D3; }
    }
  </style>
  <ellipse class="anel" cx="20" cy="10" rx="15" ry="5" stroke-width="3" stroke-opacity="0.55" />
  <ellipse class="anel" cx="20" cy="21" rx="10" ry="3.6" stroke-width="3" stroke-opacity="0.85" />
  <ellipse class="foco" cx="20" cy="31" rx="5" ry="2.2" stroke-width="3.2" />
</svg>
